function modalShell(title,body){closeModal();const root=$('#modalRoot');root.innerHTML=`<div class="backdrop" data-action="backdrop"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="row"><h2 id="modalTitle">${title}</h2><button class="iconbtn" data-action="close" aria-label="Close dialog">×</button></div>${body}</section></div>`;trapFocus($('.modal'))}function trapFocus(el){if(trapHandler)document.removeEventListener('keydown',trapHandler);observer?.disconnect();observer=new MutationObserver(()=>{if(!$('#modalRoot .modal'))closeModal()});observer.observe($('#modalRoot'),{childList:true,subtree:true});trapHandler=e=>{if(e.key==='Escape'){closeModal();return}if(e.key==='Tab'){const nodes=$$('button:not(:disabled),input:not(:disabled),textarea:not(:disabled),select:not(:disabled),[tabindex="0"]',el).filter(x=>x.offsetParent!==null);if(!nodes.length)return;const first=nodes[0],last=nodes[nodes.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}};document.addEventListener('keydown',trapHandler);setTimeout(()=>$('button,input,textarea,select',el)?.focus(),0)}function closeModal(){if(trapHandler){document.removeEventListener('keydown',trapHandler);trapHandler=null}observer?.disconnect();observer=null;const root=$('#modalRoot');if(root)root.innerHTML=''}function openDay(d){const c=checkin(d),names=(state.habitLog[d]||[]).map(id=>state.habits.find(h=>h.id===id)?.name).filter(Boolean);modalShell(pretty(d),`<p>Mood: ${c?.mood?MOODS[c.mood-1].join(' '):'—'} · Energy: ${c?.energy??'—'} · Sleep: ${c?.sleepHours??'—'}h</p><p>${esc(c?.note||'No note')}</p><h3>Habits done</h3><p>${names.length?names.map(esc).join(', '):'None logged'}</p><div class="actions">${c?`<button class="btn" data-action="day-edit" data-date="${d}">Edit check-in</button><button class="btn danger" data-action="day-delete" data-date="${d}">Delete check-in</button>`:''}</div>`)}function habitEditor(h){modalShell(h?'Edit habit':'New habit',`<form data-form="habit" data-id="${esc(h?.id||'')}"><div class="field"><label for="hname">Name</label><input id="hname" name="name" required maxlength="50" value="${esc(h?.name||'')}"></div><div class="field"><label for="hicon">Emoji icon</label><input id="hicon" name="icon" required maxlength="8" value="${esc(h?.icon||'✨')}"></div><div class="field"><label for="hcolor">Color</label><input id="hcolor" class="color-field" name="color" type="color" value="${esc(h?.color||'#7c5cff')}"></div><div class="field"><label for="frequency">Target</label><select id="frequency" name="frequency"><option value="daily">Daily</option><option value="3">3 times / week</option><option value="5">5 times / week</option></select></div><button class="btn primary">Save habit</button></form>`)}function toast(s){const t=$('#toast');t.textContent=s;t.classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>t.classList.remove('show'),2600)}function download(name,content,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([content],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}function downloadJSON(){download('pulse-backup.json',JSON.stringify(state,null,2),'application/json')}function downloadMarkdown(){const rows=state.checkins.slice().sort((a,b)=>a.date.localeCompare(b.date)).map(c=>`| ${c.date} | ${c.mood??'—'} | ${c.energy??'—'} | ${c.sleepHours??'—'} | ${c.note.replaceAll('|','\\|')} |`).join('\n');download('pulse-journal.md',`# Pulse journal\n\n| Date | Mood | Energy | Sleep (h) | Note |\n|---|---:|---:|---:|---|\n${rows}\n`,'text/markdown')}
function validateImport(x){if(!x||x.version!==1||!Array.isArray(x.checkins)||!Array.isArray(x.habits)||!x.habitLog||typeof x.habitLog!=='object'||Array.isArray(x.habitLog))throw Error('This file does not look like a valid Pulse backup.');for(const c of x.checkins){if(!c||!isValidISODate(c.date)||!(c.mood==null||(Number.isInteger(c.mood)&&c.mood>=1&&c.mood<=5))||!(c.energy==null||(Number.isInteger(c.energy)&&c.energy>=1&&c.energy<=10))||!(c.sleepHours==null||(Number.isFinite(c.sleepHours)&&c.sleepHours>=0&&c.sleepHours<=24)))throw Error('A check-in has an invalid date or value.')}for(const h of x.habits)if(!h||typeof h.id!=='string'||!h.id||typeof h.name!=='string'||!h.name||typeof h.icon!=='string'||!/^#[0-9a-f]{6}$/i.test(h.color))throw Error('A habit is missing required details or has an invalid color.');for(const [d,ids]of Object.entries(x.habitLog))if(!isValidISODate(d)||!Array.isArray(ids)||ids.some(i=>typeof i!=='string'))throw Error('Habit history is malformed.')}async function importHandler(file){try{const x=JSON.parse(await file.text());validateImport(x);if(!confirm('Replace your current Pulse data with this backup?'))return;state=normalizeState(x);save();document.body.dataset.theme=state.settings.theme;toast('Backup imported');render()}catch(e){toast(e.message||'Could not read that backup.')}}function summaryText(){const recent=state.checkins.filter(c=>c.date>=addDays(today(),-6)&&c.mood!=null),m=mean(recent.map(c=>c.mood)),sl=mean(recent.map(c=>c.sleepHours).filter(Number.isFinite)),done=state.habits.filter(h=>!h.archived).sort((a,b)=>habitStreak(b.id)-habitStreak(a.id))[0];return `Over the last week, your average mood was ${m==null?'not recorded':m.toFixed(1)+' out of 5'}${sl==null?'':`, with ${sl.toFixed(1)} hours of sleep on average`}. ${done?`${done.name} is leading with a ${habitStreak(done.id)} day current streak.`:'Keep tracking habits to spot the routines that support you.'} Small patterns become clearer with time.`}
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;const a=b.dataset.action;if(a==='tab'){page=b.dataset.page;render()}if(a==='settings'){page='settings';render()}if(a==='review'){page='review';render()}if(a==='mood'){selectedMood=+b.dataset.value;$$('.mood').forEach(x=>x.setAttribute('aria-pressed',x===b))}if(a==='edit-checkin'){editingDate=today();$('#view .card').innerHTML=checkinForm(checkin(today()))}if(a==='toggle'){const d=today(),id=b.dataset.id;state.habitLog[d] ||= [];state.habitLog[d]=completed(d,id)?state.habitLog[d].filter(x=>x!==id):[...state.habitLog[d],id];save();render()}if(a==='new-habit')habitEditor();if(a==='edit-habit')habitEditor(state.habits.find(h=>h.id===b.dataset.id));if(a==='delete-habit'){const h=state.habits.find(x=>x.id===b.dataset.id);if(confirm(`Delete “${h.name}” and its habit history?`)){state.habits=state.habits.filter(x=>x.id!==h.id);Object.keys(state.habitLog).forEach(d=>state.habitLog[d]=state.habitLog[d].filter(x=>x!==h.id));save();render()}}if(a==='archive'){const h=state.habits.find(x=>x.id===b.dataset.id);h.archived=!h.archived;save();render()}if(a==='move'){const arr=state.habits.slice().sort((x,y)=>x.order-y.order),i=arr.findIndex(x=>x.id===b.dataset.id),j=Math.max(0,Math.min(arr.length-1,i+(+b.dataset.dir)));[arr[i].order,arr[j].order]=[arr[j].order,arr[i].order];save();render()}if(a==='day')openDay(b.dataset.date);if(a==='close'||a==='backdrop'&&e.target===b)closeModal();if(a==='day-edit'){editingDate=b.dataset.date;closeModal();page='today';render();$('#view .card').innerHTML=checkinForm(checkin(editingDate))}if(a==='day-delete'){const d=b.dataset.date;if(confirm('Delete this day’s check-in?')){state.checkins=state.checkins.filter(c=>c.date!==d);save();closeModal();render()}}if(a==='summary')$('#weeklySummary').textContent=summaryText();if(a==='export-json')downloadJSON();if(a==='export-md')downloadMarkdown();if(a==='reset'&&confirm('Reset all Pulse data and restore the demo?')&&confirm('This replaces your current data. Continue?')){state=normalizeState(demoState());save();document.body.dataset.theme=state.settings.theme;toast('Demo data restored');render()}});
document.addEventListener('submit',e=>{const f=e.target;if(f.dataset.form==='checkin'){e.preventDefault();saveCheckin(new FormData(f))}if(f.dataset.form==='habit'){e.preventDefault();const fd=new FormData(f),old=state.habits.find(h=>h.id===f.dataset.id);const h={...(old||{}),id:old?.id||uid(),name:String(fd.get('name')).trim(),icon:String(fd.get('icon')).trim(),color:fd.get('color'),frequency:fd.get('frequency')==='daily'?'daily':{timesPerWeek:+fd.get('frequency')},archived:false,order:old?.order??state.habits.length,createdAt:old?.createdAt||today()};if(old)state.habits=state.habits.map(x=>x.id===old.id?h:x);else state.habits.push(h);save();closeModal();render();toast('Habit saved')}});document.addEventListener('input',e=>{if(e.target.id==='energy')$('#energyLabel').textContent=e.target.value});document.addEventListener('change',e=>{if(e.target.id==='range'){range=+e.target.value;render()}if(e.target.id==='overlay'){overlay=e.target.checked;render()}if(e.target.id==='yearSelect')drawHeatmap($('#heatmap'),+e.target.value);if(e.target.id==='theme'){state.settings.theme=e.target.value;document.body.dataset.theme=e.target.value;save()}if(e.target.id==='reminder'){state.settings.reminderTime=e.target.value;save()}if(e.target.id==='importFile'&&e.target.files[0])importHandler(e.target.files[0])});window.addEventListener('resize',()=>{if(page==='trends')render();if(page==='insights')drawScatterCanvases()});render();try{if(location.protocol!=='file:'&&'serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{})}catch{}
})();</script></body></html>
